
name: Create DevOps Roadmap Issues

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-roadmap-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Create weekly roadmap issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          create_issue() {
            title="$1"
            body="$2"

            existing=$(gh issue list \
              --repo "$GH_REPO" \
              --state all \
              --search "$title in:title" \
              --json title \
              --jq "[.[] | select(.title == \"$title\")] | length")

            if [ "$existing" -gt 0 ]; then
              echo "Already exists, skipping: $title"
            else
              gh issue create \
                --repo "$GH_REPO" \
                --title "$title" \
                --body "$body"
              echo "Created: $title"
            fi
          }

          create_issue "Week 1: Python Basics" \
            "Topics: Variables, data types and operators.

          - [ ] Study concepts
          - [ ] Watch a learning video
          - [ ] Write Python code
          - [ ] Practise exercises
          - [ ] Upload practice to GitHub

          Study hours:
          Doubts and notes:"

          create_issue "Week 2: Conditions, Loops and Functions" \
            "Topics: Conditions, loops and functions.

          - [ ] Study concepts
          - [ ] Watch a learning video
          - [ ] Write Python code
          - [ ] Practise exercises
          - [ ] Upload practice to GitHub

          Study hours:
          Doubts and notes:"

          create_issue "Week 3: Python Collections" \
            "Topics: Lists, strings, sets and dictionaries.

